<style>
    .scrape-activity { background: #131923; border-bottom: 1px solid #2a3545; padding: 0 20px; color: #cbd5e1; }
    .scrape-activity summary { padding: 12px 0; cursor: pointer; font-size: 12px; min-height: 44px; }
    .scrape-activity summary:focus-visible { outline: 2px solid #60a5fa; }
    .scrape-activity p { font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
    .scrape-activity-scroll { max-height: 260px; overflow: auto; margin-bottom: 12px; }
    .scrape-activity table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .scrape-activity th, .scrape-activity td { padding: 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid #293344; }
    .scrape-activity th { position: sticky; top: 0; background: #192332; }
</style>
<details class="scrape-activity" id="scrape-activity">
    <summary>Scraper activity &middot; Last 10 days <span id="scrape-activity-count"></span></summary>
    <p>Each row is one county source run. Found includes previously seen leads; new added counts additions to our inventory. Times are in your local timezone.</p>
    <p id="scrape-activity-message" role="status">Loading run history...</p>
    <div class="scrape-activity-scroll" tabindex="0" aria-label="Scraper run history" hidden>
        <table aria-label="Scraper runs over the last 10 days">
            <thead><tr><th>Run time</th><th>County</th><th>Source</th><th>Found</th><th>New added</th><th>Status</th></tr></thead>
            <tbody id="scrape-activity-rows"></tbody>
        </table>
    </div>
</details>
<script>
(() => {
    const panel = document.getElementById('scrape-activity');
    let loaded = false, loading = false;
    panel.addEventListener('toggle', async () => {
        if (!panel.open || loaded || loading) return;
        loading = true;
        const message = document.getElementById('scrape-activity-message');
        message.textContent = 'Loading run history...';
        try {
            const response = await fetch('/api/scrape-activity');
            if (!response.ok) throw new Error('Unable to load history');
            const data = await response.json();
            const rows = document.getElementById('scrape-activity-rows');
            const fragment = document.createDocumentFragment();
            for (const run of data.runs) {
                const row = document.createElement('tr');
                const status = {complete: 'Complete', failed: 'Failed', receiving: 'Receiving', unknown: 'Unknown'}[run.status] || 'Unknown';
                for (const value of [new Date(run.time).toLocaleString(), run.county, run.source,
                    run.status === 'failed' ? '—' : run.found.toLocaleString(), run.added.toLocaleString(), status]) {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                }
                fragment.appendChild(row);
            }
            rows.replaceChildren(fragment);
            document.getElementById('scrape-activity-count').textContent = `· ${data.runs.length} runs`;
            message.textContent = data.runs.length ? '' : 'No recorded scraper runs in the last 10 days.';
            panel.querySelector('.scrape-activity-scroll').hidden = !data.runs.length;
            loaded = true;
        } catch (error) {
            message.textContent = 'Run history is temporarily unavailable. Close and reopen to retry.';
        } finally { loading = false; }
    });
})();
</script>
