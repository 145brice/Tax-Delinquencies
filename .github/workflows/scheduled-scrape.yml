name: Scheduled county scrape

on:
  schedule:
    # Aim five minutes after each learned/local posting hour. GitHub may start
    # scheduled jobs a few minutes late; the run ledger records the real time.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      county:
        description: "County key to run, or all"
        required: true
        default: "all"

concurrency:
  group: county-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        env:
          REQUESTED_COUNTY: ${{ github.event.inputs.county }}
          SCRAPE_TARGET_URL: ${{ secrets.SCRAPE_TARGET_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          args=()
          if [ -n "$REQUESTED_COUNTY" ]; then args=(--county "$REQUESTED_COUNTY"); fi
          matrix="$(python scripts/plan_county_jobs.py "${args[@]}")"
          count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape, deliver, and exit
        env:
          SCRAPE_TARGET_URL: ${{ secrets.SCRAPE_TARGET_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SCHEDULE_REASON: ${{ matrix.schedule_reason }}
          SCHEDULED_LOCAL_TIME: ${{ matrix.scheduled_local_time }}
        run: python scripts/run_county_job.py --county "${{ matrix.county }}" --attempts 2
